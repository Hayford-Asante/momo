<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMo Money Transfer App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            width: min(680px, 100%);
        }

        .logo {
            font-size: 42px;
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 8px;
            color: #333;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 0 0 16px;
        }

        .balance-card {
            background: #f2f6ff;
            border: 1px solid #dce7ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-weight: 600;
            color: #354a70;
        }

        .status-card {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #dce7ff;
            background: #f9fbff;
        }

        .status-card h3 {
            margin: 0 0 8px;
            color: #333;
        }

        .status-card ul {
            margin: 0;
            padding-left: 18px;
            color: #555;
        }

        .status-card.success {
            background: #f3fff7;
            border-color: #bcf1cf;
        }

        .status-card.error {
            background: #fff5f5;
            border-color: #ffd3d3;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .menu-btn,
        button[type="submit"],
        button[type="button"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-btn:hover,
        button:hover {
            transform: translateY(-1px);
        }

        form {
            background: #fbfcff;
            border: 1px solid #e6ebf7;
            border-radius: 8px;
            padding: 12px;
        }

        form h3 {
            margin-top: 0;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #d7dceb;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💰</div>
        <h1>MoMo Money Transfer App</h1>
        <p class="subtitle">Interactive browser experience</p>

        <div class="balance-card">
            <span>Mobile Wallet: <strong id="mobile-balance">GHC 0.00</strong></span>
            <span>Bank Balance: <strong id="bank-balance">GHC 0.00</strong></span>
        </div>

        <div id="status"></div>
        <div id="menu" class="menu"></div>

        <form id="action-form">
            <div id="form-fields"></div>
            <div class="form-actions">
                <button type="submit" id="submit-btn">Continue</button>
                <button type="button" id="back-btn">Back</button>
            </div>
        </form>

        <p class="footer">Use the on-screen buttons and forms instead of the browser console.</p>
    </div>

    <script src="momo.js"></script>
</body>
</html>
