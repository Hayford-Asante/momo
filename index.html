<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoMo Money Transfer App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #2b2f4d 0%, #11131f 80%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        color: #f1f5ff;
      }

      .container {
        background: #12131b;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        width: min(680px, 100%);
        max-width: 680px;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      :root {
        --logo-yellow: #ffcc00;
        --logo-yellow-dark: #d6a600;
      }

      .logo {
        text-align: center;
        margin-bottom: 8px;
      }

      .logo img {
        max-width: 160px;
        width: 100%;
        height: auto;
        display: inline-block;
        border-radius: 20px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
      }

      h1 {
        margin: 0 0 8px;
        color: #fefefe;
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: #b8c2ff;
        margin: 0 0 16px;
      }

      .balance-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-weight: 600;
        color: #f5f9ff;
      }

      .status-card {
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
      }

      .status-card h3 {
        margin: 0 0 8px;
        color: #f8f9ff;
      }

      .status-card ul {
        margin: 0;
        padding-left: 18px;
        color: #d8dbff;
      }

      .status-card.success {
        background: rgba(255, 235, 141, 0.12);
        border-color: rgba(255, 216, 75, 0.3);
      }

      .status-card.error {
        background: rgba(255, 99, 99, 0.12);
        border-color: rgba(255, 99, 99, 0.3);
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .menu-btn,
      button[type="submit"],
      button[type="button"] {
        background: linear-gradient(
          135deg,
          var(--logo-yellow) 0%,
          var(--logo-yellow-dark) 100%
        );
        color: #111112;
        border: none;
        padding: 14px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 15px;
        transition:
          transform 0.15s ease,
          filter 0.15s ease,
          box-shadow 0.15s ease;
        box-shadow: 0 10px 20px rgba(204, 151, 0, 0.22);
      }

      .menu-btn:hover,
      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
      }

      form {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 16px;
      }

      form h3 {
        margin-top: 0;
        color: #f8f9ff;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 14px;
        color: #d8dbff;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.05);
        color: #eef1ff;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .footer {
        text-align: center;
        color: #a9afc9;
        margin-top: 10px;
        font-size: 12px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }
        .container {
          padding: 18px 14px;
          width: 100%;
        }
        .menu {
          grid-template-columns: 1fr;
        }
        .menu-btn,
        button[type="submit"],
        button[type="button"] {
          font-size: 16px;
          width: 100%;
          box-sizing: border-box;
        }
        input {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo"><img src="53465.jpg" alt="App Logo" /></div>
      <h1>MoMo App</h1>
      <p class="subtitle">Interactive browser experience</p>

      <div class="balance-card">
        <span
          >Mobile Wallet: <strong id="mobile-balance">GHC 0.00</strong></span
        >
        <span>Bank Balance: <strong id="bank-balance">GHC 0.00</strong></span>
      </div>

      <div id="status"></div>
      <div id="menu" class="menu"></div>

      <form id="action-form">
        <div id="form-fields"></div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Continue</button>
          <button type="button" id="back-btn">Back</button>
        </div>
      </form>

      <p class="footer">
        Use the on-screen buttons and forms instead of the browser console.
      </p>
    </div>

    <script src="momo.js"></script>
  </body>
</html>
